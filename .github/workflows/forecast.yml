
name: AI Forecast Job

on:
  schedule:
    - cron: '*/30 * * * *' # Chạy mỗi 30 phút
  workflow_dispatch:

# Không cho 2 lần chạy chồng nhau
concurrency:
  group: ai-forecast
  cancel-in-progress: false

jobs:
  run-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f ai/requirements.txt ]; then
            echo "Tim thay requirements.txt"
            pip install -r ai/requirements.txt
          else
            echo "Khong tim thay requirements.txt"
            echo "Tien hanh cai thu vien truc tiep"
            pip install numpy scikit-learn
          fi

      - name: Run AI
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL || 'https://khoitrongham-default-rtdb.asia-southeast1.firebasedatabase.app' }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_EMAIL: ${{ secrets.AI_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.AI_PASSWORD }}
          PYTHONUNBUFFERED: "1"

        run: python ai/forecast.py
